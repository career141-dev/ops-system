name: CI

on:
  pull_request:
  push:
    branches: [main]
  # So the preview deploy can run the same checks before it deploys.
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Tests
        run: npm test
      - name: Types
        run: npm run typecheck
